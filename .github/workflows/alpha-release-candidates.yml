name: OPAL Alpha Release Candidates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upgrade_from:
        description: Optional prior release tag or commit for the Windows upgrade check.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: opal-alpha-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opal-prototype/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
        working-directory: opal-prototype
      - run: npm run verify
        working-directory: opal-prototype

  build-macos:
    needs: verify
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opal-prototype/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
        working-directory: opal-prototype
      - id: release_version
        name: Read release version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
        working-directory: opal-prototype
      - name: Build unsigned universal macOS candidate
        run: npm run release:macos:unsigned
        working-directory: opal-prototype
        env:
          OPAL_BUILD_COMMIT: ${{ github.sha }}
          OPAL_SKIP_VERIFY: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: opal-${{ steps.release_version.outputs.version }}-macos-universal
          path: opal-prototype/artifacts/release/${{ steps.release_version.outputs.version }}/macos-universal/
          if-no-files-found: error
          retention-days: 14

  smoke-macos:
    needs: build-macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: opal-${{ needs.build-macos.outputs.version }}-macos-universal
          path: opal-prototype/artifacts/macos-universal
      - name: Verify downloaded DMG installation and first launch
        run: bash scripts/verify-macos-dmg.sh "artifacts/macos-universal/OPAL-${{ needs.build-macos.outputs.version }}-macos-universal.dmg"
        working-directory: opal-prototype

  build-windows:
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opal-prototype/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - run: npm ci
        working-directory: opal-prototype
      - id: release_version
        name: Read release version
        shell: pwsh
        run: |
          $version = node -p 'require("./package.json").version'
          "version=$version" >> $env:GITHUB_OUTPUT
        working-directory: opal-prototype
      - run: npm run verify
        working-directory: opal-prototype
      - name: Build current Windows candidate
        run: npm run release:windows
        working-directory: opal-prototype
        env:
          OPAL_BUILD_COMMIT: ${{ github.sha }}
          OPAL_SKIP_VERIFY: "1"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.upgrade_from }}
          path: upgrade-baseline
          fetch-depth: 1
          persist-credentials: false
        if: ${{ inputs.upgrade_from != '' }}
      - name: Build baseline fixture and verify upgrade
        if: ${{ inputs.upgrade_from != '' }}
        shell: pwsh
        run: |
          $baselineRoot = Join-Path $env:GITHUB_WORKSPACE "upgrade-baseline/opal-prototype"
          Copy-Item "opal-prototype/src-tauri/examples/create-fixtures.rs" (Join-Path $baselineRoot "src-tauri/examples/create-fixtures.rs") -Force
          Copy-Item "opal-prototype/src-tauri/src/dev_fixtures.rs" (Join-Path $baselineRoot "src-tauri/src/dev_fixtures.rs") -Force
          $env:OPAL_FIXTURE_MANIFEST = Join-Path $env:RUNNER_TEMP "opal-upgrade-fixtures.json"
          $env:OPAL_FIXTURE_OUTPUT_ROOT = Join-Path $env:RUNNER_TEMP "opal-upgrade-fixture-output"
          $env:OPAL_BUILD_COMMIT = (git -C $baselineRoot rev-parse HEAD).Trim()
          Push-Location $baselineRoot
          npm ci
          npm run fixtures:create
          npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --ci --no-sign
          Pop-Location
          $fixtureManifest = Get-Content $env:OPAL_FIXTURE_MANIFEST -Raw | ConvertFrom-Json
          $baselineInstaller = Get-ChildItem (Join-Path $baselineRoot "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis") -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $baselineInstaller) { throw "Could not find the baseline installer." }
          $currentInstaller = Get-ChildItem "opal-prototype/artifacts/release/${{ steps.release_version.outputs.version }}/windows-x64" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $currentInstaller) { throw "Could not find the current alpha installer." }
          & "opal-prototype/scripts/verify-windows-installer.ps1" -CurrentInstaller $currentInstaller.FullName -BaselineInstaller $baselineInstaller.FullName -UpgradeFixture $fixtureManifest.small
      - uses: actions/upload-artifact@v4
        with:
          name: opal-${{ steps.release_version.outputs.version }}-windows-x64
          path: opal-prototype/artifacts/release/${{ steps.release_version.outputs.version }}/windows-x64/
          if-no-files-found: error
          retention-days: 14
